[supabase]
url = "https://YOUR_PROJECT_REF.supabase.co"
publishable_key = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY"

[arena]
# Generate with: python scripts/generate_signing_key.py
signing_key = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
github_url = "https://github.com/YOUR_ACCOUNT/ai-delivery-arena"
app_url = "https://YOUR-APP.streamlit.app"
# Keep false in a hosted deployment. Local Alpha runs through scripts/start_arena.py.
allow_local_mode = false

[canary]
# Comma-separated invited addresses. Sign-in and sign-up are both rejected
# server-side when the normalized email is not in this list.
emails = "participant.one@example.com,participant.two@example.com"
feedback_url = "https://YOUR-FEEDBACK-FORM"
incident_email = "arena-incident@example.com"
