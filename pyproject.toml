[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-delivery-arena"
version = "0.6.0"
description = "Open-source enterprise AI delivery simulation and assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-delivery-arena = "ai_delivery_arena.web.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_delivery_arena.web" = ["static/*.html", "static/*.css", "static/*.js"]
"ai_delivery_arena.hosted" = ["static/*.css"]
"ai_delivery_arena.react_ui" = [
  "frontend/build/*.js",
  "frontend/build/*.css",
]
